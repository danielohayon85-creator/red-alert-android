name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: azakon-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Unsigned — assembleDebug never exercises R8/minification (isMinifyEnabled=false for
      # debug), so this is the only thing in CI that would catch a missing ProGuard keep rule
      # before it becomes a release-only runtime crash. Signing (needed for an actual Play
      # Store upload) requires a keystore the app owner must create and manage themselves — not
      # something to generate or embed here.
      - name: Build unsigned release APK + AAB (verifies R8/minification only, not signed)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azakon-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**/*.xml
