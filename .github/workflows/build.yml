name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets.* can't be referenced directly inside a step's `if:` (GitHub Actions rejects it as
    # an unrecognized named-value there) — mirroring it into job-level env makes it visible to
    # `if: env.HAS_KEYSTORE_SECRET != ''` below.
    env:
      HAS_KEYSTORE_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: azakon-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # No-op unless the repo owner has added these secrets (Settings -> Secrets and variables ->
      # Actions): KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without them, release builds stay unsigned exactly as before — this step just writes the
      # same keystore.properties file app/build.gradle.kts already knows how to read locally.
      - name: Set up release signing from CI secrets (skipped if not configured)
        if: ${{ env.HAS_KEYSTORE_SECRET != '' }}
        run: |
          echo "$HAS_KEYSTORE_SECRET" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Also the only thing in CI that exercises R8/minification at all, since assembleDebug
      # never does (isMinifyEnabled=false for debug) — catches a missing ProGuard keep rule
      # before it becomes a release-only runtime crash.
      - name: Build release APK + AAB (signed if secrets are configured, unsigned otherwise)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azakon-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**/*.xml
